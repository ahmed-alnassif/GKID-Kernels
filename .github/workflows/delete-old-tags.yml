name: Hapus tag lama (sekali pakai)

# One-time cleanup (owner approval 2026-10-16): deletes only the 246 GKID release tags of
# Ahmed Al-Nassif listed in docs/archive/gkid-upstream-tags.tsv, and only while each tag
# still points at its archived commit and has no GitHub Release. Every tag can be restored
# from ahmed-alnassif/GKID-Kernels (command in the archive header). Remove this workflow
# once the tags are gone.

on:
  workflow_dispatch:
    inputs:
      konfirmasi:
        description: "Ketik HAPUS untuk benar-benar menghapus tag dari arsip. Kosong = cek saja, tidak ada yang dihapus."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: delete-old-tags
  cancel-in-progress: false

jobs:
  delete-old-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag archive
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Compare the archive with the repository tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git ls-remote --tags origin > remote-tags.txt
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' > release-tags.txt
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          # Never touched, even if someone adds them to the archive by mistake.
          KEEP = {"v26.10.14-r2", "v26.10.14-r3", "ci-ccache-store", "cogan-mirror"}
          archive = {}
          for line in Path("docs/archive/gkid-upstream-tags.tsv").read_text().splitlines():
              if not line or line.startswith("#"):
                  continue
              tag, commit = line.split("\t")[:2]
              if not re.fullmatch(r"[A-Za-z0-9._-]+", tag) or not re.fullmatch(r"[0-9a-f]{40}", commit):
                  raise SystemExit(f"Bad archive line: {line!r}")
              # Ahmed's tags end at v26.10.13; Cogan's own releases start at v26.10.14.
              dated = re.match(r"v(\d{2})\.(\d{2})\.(\d{2})-", tag)
              if tag in KEEP or (dated and tuple(map(int, dated.groups())) >= (26, 10, 14)):
                  raise SystemExit(f"Archive lists a Cogan tag ({tag}); refusing to run")
              archive[tag] = commit
          remote = {}
          for line in Path("remote-tags.txt").read_text().splitlines():
              sha, ref = line.split("\t")
              name = ref[len("refs/tags/"):]
              if name.endswith("^{}"):
                  remote[name[:-3]] = sha  # peeled commit of an annotated tag wins
              else:
                  remote.setdefault(name, sha)
          releases = set(Path("release-tags.txt").read_text().split())
          plan, gone, moved, released = [], [], [], []
          for tag, commit in archive.items():
              if tag not in remote:
                  gone.append(tag)
              elif remote[tag] != commit:
                  moved.append(f"{tag} ({remote[tag][:8]}, arsip {commit[:8]})")
              elif tag in releases:
                  released.append(tag)
              else:
                  plan.append(tag)
          Path("delete-plan.txt").write_text("".join(t + "\n" for t in plan))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Hapus tag lama\n\n")
              summary.write(f"- Di arsip: {len(archive)}\n- Akan dihapus: **{len(plan)}**\n")
              summary.write(f"- Sudah tidak ada: {len(gone)}\n")
              summary.write(f"- Dilewati, commit berubah: {len(moved)}" + (": " + ", ".join(moved) if moved else "") + "\n")
              summary.write(f"- Dilewati, punya GitHub Release: {len(released)}"
                            + (": " + ", ".join(released) if released else "") + "\n")
          print(f"{len(plan)} to delete, {len(gone)} already gone, {len(moved)} moved, {len(released)} with release")
          PY

      - name: Delete the planned tags
        if: inputs.konfirmasi == 'HAPUS'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deleted=0 failed=0
          while IFS= read -r tag; do
            if gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" > /dev/null 2> error.txt; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "::warning::$tag: $(head -c 200 error.txt)"
            fi
          done < delete-plan.txt
          {
            echo "- **Terhapus: $deleted**, gagal: $failed"
            if [ "$failed" -gt 0 ]; then
              echo "- Gagal biasanya karena ruleset melindungi tag: matikan sementara aturan *Restrict deletions* untuk tag di Settings → Rules, lalu jalankan lagi."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

      - name: Check only
        if: inputs.konfirmasi != 'HAPUS'
        run: echo "- Cek saja; tidak ada yang dihapus. Jalankan lagi dengan konfirmasi HAPUS." >> "$GITHUB_STEP_SUMMARY"
