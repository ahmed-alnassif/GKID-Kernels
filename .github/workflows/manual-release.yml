name: Manual Release from Run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Cogan build run ID"
        required: true
        type: string
      release_type:
        description: "Draft = belum tampil, cek dulu lalu publish sendiri; Pre-release = langsung tampil berlabel Pre-release; Release = langsung tampil sebagai rilis resmi (Latest)"
        type: choice
        default: "Draft"
        options:
          - "Draft"
          - "Pre-release"
          - "Release"

permissions:
  actions: read
  contents: write

jobs:
  manual-release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || { echo "::error::Run ID must be numeric"; exit 1; }
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN" > source-run.json
          python3 - <<'PY'
          import json, os
          data=json.load(open("source-run.json"))
          if data.get("conclusion") != "success":
              raise SystemExit("Source run did not succeed; release refused")
          if data.get("event") != "workflow_dispatch":
              raise SystemExit("Source run must be a manually dispatched build")
          if data.get("head_branch") != "dev":
              raise SystemExit("Source run must originate from dev")
          if not str(data.get("path","")).endswith(".github/workflows/build.yml"):
              raise SystemExit("Source run is not the Cogan build workflow")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("SOURCE_SHA=" + data["head_sha"] + "\n")
          print("Validated build run", data["id"], data["head_sha"])
          PY

      - name: Download kernel build artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" --jq '.jobs[] | select(.name | startswith("build (")) | [.name, .conclusion] | @tsv' > build-jobs.tsv
          gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("build-") and (startswith("build-env-") | not))) | .name' > artifact-names.txt
          python3 - <<'PY'
          from pathlib import Path
          jobs = [line.split("\t") for line in Path("build-jobs.tsv").read_text().splitlines() if line.strip()]
          artifacts = Path("artifact-names.txt").read_text().splitlines()
          if not jobs or not artifacts:
              raise SystemExit("Missing build matrix jobs or unexpired build artifacts")
          failed = [name for name, result in jobs if result != "success"]
          if failed:
              raise SystemExit("Unsuccessful kernel build jobs: " + ", ".join(failed))
          # GitHub matrix job name: build (6.1-KSU)
          # Artifact name: build-6.1-KSU-<run_number>
          variants = [name[len("build ("):-1] for name, _ in jobs if name.endswith(")")]
          if len(variants) != len(jobs) or len(set(variants)) != len(variants):
              raise SystemExit("Unexpected or duplicate matrix job names")
          if len(artifacts) != len(variants):
              raise SystemExit("Build artifact count does not match matrix job count")
          run_number = str(__import__("json").load(open("source-run.json"))["run_number"])
          expected = {"build-" + variant + "-" + run_number for variant in variants}
          if set(artifacts) != expected:
              raise SystemExit(f"Artifact mismatch: expected {sorted(expected)}, got {sorted(artifacts)}")
          print("Verified", len(variants), "successful matrix build(s) and matching artifacts")
          PY
          while IFS= read -r name; do
            gh run download "$SOURCE_RUN" --repo "$REPO" --name "$name" --dir "downloads/$name"
          done < artifact-names.txt
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          roots = sorted(Path("downloads").glob("build-*"))
          if not roots:
              raise SystemExit("No build artifacts downloaded")
          seen = set()
          for root in roots:
              zips = list(root.rglob("*.zip"))
              if len(zips) != 1:
                  raise SystemExit(f"{root.name}: expected exactly one kernel ZIP, found {len(zips)}")
              source = zips[0]
              if source.name in seen:
                  raise SystemExit(f"Duplicate ZIP filename: {source.name}")
              seen.add(source.name)
              shutil.copy2(source, Path("release-files") / source.name)
          print(f"Selected {len(seen)} distinct kernel ZIP(s)")
          PY

      - name: Validate flash ZIPs and generate checksums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          zips=list(Path("release-files").glob("*.zip"))
          if not zips:
              raise SystemExit("No ZIP to release")
          for path in zips:
              with zipfile.ZipFile(path) as archive:
                  names=archive.namelist()
                  if "anykernel.sh" not in names or "Image" not in names:
                      raise SystemExit(f"{path.name}: invalid AnyKernel root")
                  if any(n.lower().endswith((".zip",".7z",".rar")) for n in names):
                      raise SystemExit(f"{path.name}: nested archive detected")
                  if archive.testzip():
                      raise SystemExit(f"{path.name}: corrupt archive")
              print("Validated", path.name)
          PY
          cd release-files
          sha256sum -- *.zip > checksums.txt

      - name: Read release name from the build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Every matrix job writes the same RELEASE (vYY.MM.DD-rN) to its build-env artifact.
          env_name="$(gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("build-env-"))) | .name' | head -n 1)"
          [ -n "$env_name" ] || { echo "::error::No unexpired build-env artifact in run $SOURCE_RUN"; exit 1; }
          gh run download "$SOURCE_RUN" --repo "$REPO" --name "$env_name" --dir build-env
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          files = sorted(Path("build-env").rglob("build-env-*.txt"))
          if not files:
              raise SystemExit("build-env file missing")
          values = dict(line.split("=", 1) for line in files[0].read_text().splitlines() if "=" in line)
          release, name = values.get("RELEASE", ""), values.get("RELEASE_NAME", "")
          # Tags like v26.10.16-r15 keep the README release badge (filter v*) pointing at real releases.
          if not re.fullmatch(r"v\d{2}\.\d{2}\.\d{2}(-r\d+)+", release):
              raise SystemExit(f"Unexpected RELEASE value {release!r}")
          if not re.fullmatch(r"[A-Za-z0-9 ._+()-]+", name):
              raise SystemExit(f"Unexpected RELEASE_NAME value {name!r}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"RELEASE_TAG={release}\nRELEASE_TITLE={name}\n")
          print("Release", release, "-", name)
          PY

      - name: Create release (draft, pre-release or release)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi
          case "$RELEASE_TYPE" in
            Draft) mode=(--draft --prerelease); shown="Draft (belum tampil / not published)" ;;
            Pre-release) mode=(--prerelease); shown="Pre-release (tampil / published as pre-release)" ;;
            Release) mode=(--latest); shown="Release (tampil sebagai rilis resmi / published as latest release)" ;;
            *) echo "::error::Unknown release type $RELEASE_TYPE"; exit 1 ;;
          esac
          {
            echo "Dibangun dari / built from run [$SOURCE_RUN]($SERVER/$REPO/actions/runs/$SOURCE_RUN)."
            echo ""
            echo "> [!CAUTION]"
            echo "> 🇮🇩 Hanya struktur ZIP yang divalidasi; boot di perangkat **belum diuji**. Simpan \`boot.img\` stock sebelum flash: [Panduan Bootloop]($SERVER/$REPO/blob/HEAD/docs/bootloop.md)."
            echo "> 🇬🇧 Only the ZIP structure was validated; device boot is **not tested**. Keep your stock \`boot.img\` before flashing: [Bootloop Guide]($SERVER/$REPO/blob/HEAD/docs/bootloop.en.md)."
          } > release-notes.md
          gh release create "$RELEASE_TAG" release-files/*.zip release-files/checksums.txt \
            --repo "$REPO" --target "$SOURCE_SHA" "${mode[@]}" \
            --title "$RELEASE_TITLE" --notes-file release-notes.md
          {
            echo "## Manual release"
            echo "- Tag: \`$RELEASE_TAG\` — $RELEASE_TITLE"
            echo "- Jenis / type: **$shown**"
            echo "- Sumber / source run: $SOURCE_RUN (belum diuji di perangkat / not device-tested)"
          } >> "$GITHUB_STEP_SUMMARY"
