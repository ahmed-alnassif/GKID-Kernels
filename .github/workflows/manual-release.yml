name: Manual Release from Run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Cogan build run ID"
        required: true
        type: string
      release_type:
        description: "Draft = belum tampil, cek dulu lalu publish sendiri; Pre-release = langsung tampil berlabel Pre-release; Release = langsung tampil sebagai rilis resmi (Latest)"
        type: choice
        default: "Draft"
        options:
          - "Draft"
          - "Pre-release"
          - "Release"
      ganti_rilis:
        description: "Ganti rilis yang tag-nya sama (rilis lama + tag-nya dihapus, lalu dibuat ulang dari run ini)"
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

jobs:
  manual-release:
    runs-on: ubuntu-latest
    steps:
      # Scripts and docs/whats-new for the notes, with history for "what's new" since the
      # previous release; the release files themselves come from the run's downloads.
      - name: Checkout release scripts
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || { echo "::error::Run ID must be numeric"; exit 1; }
          gh api "repos/$REPO/actions/runs/$SOURCE_RUN" > source-run.json
          python3 - <<'PY'
          import json, os
          data=json.load(open("source-run.json"))
          if data.get("conclusion") != "success":
              raise SystemExit("Source run did not succeed; release refused")
          if data.get("event") != "workflow_dispatch":
              raise SystemExit("Source run must be a manually dispatched build")
          if data.get("head_branch") != "dev":
              raise SystemExit("Source run must originate from dev")
          if not str(data.get("path","")).endswith(".github/workflows/build.yml"):
              raise SystemExit("Source run is not the Cogan build workflow")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("SOURCE_SHA=" + data["head_sha"] + "\n")
          print("Validated build run", data["id"], data["head_sha"])
          PY

      - name: Download the build's files (kernel, manager, NoMount)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" --jq '.jobs[] | select(.name | startswith("build (")) | [.name, .conclusion] | @tsv' > build-jobs.tsv
          gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | [.id, .name, (.digest // "")] | @tsv' > run-artifacts.tsv
          python3 - <<'PY'
          import re
          from pathlib import Path
          jobs = [line.split("\t") for line in Path("build-jobs.tsv").read_text().splitlines() if line.strip()]
          if not jobs:
              raise SystemExit("No build matrix jobs in the source run")
          failed = [name for name, result in jobs if result != "success"]
          if failed:
              raise SystemExit("Unsuccessful kernel build jobs: " + ", ".join(failed))
          # GitHub matrix job name lists every matrix value, the variant first:
          #   build (6.1-KSUN+SUSFS, KSUN, false, true, false, false, 6.1)
          variants = [name[len("build ("):-1].split(", ")[0] for name, _ in jobs if name.endswith(")")]
          if len(variants) != len(jobs) or len(set(variants)) != len(variants):
              raise SystemExit("Unexpected or duplicate matrix job names")
          # The numbered direct downloads of the build (prepare_downloads.py), the same files
          # the run summary lists: 1-KERNEL_, 2-MANAGER_, 3-MANAGER-SPOOFED_, 4-NOMOUNT-MODULE_.
          numbered = re.compile(r"[1-4]-(KERNEL|MANAGER|MANAGER-SPOOFED|NOMOUNT-MODULE)_[A-Za-z0-9._+-]+\.(zip|apk)")
          picked = []
          for line in Path("run-artifacts.tsv").read_text().splitlines():
              artifact_id, name, digest = (line.split("\t") + [""])[:3]
              if not numbered.fullmatch(name):
                  continue
              if not re.fullmatch(r"\d+", artifact_id) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit(f"{name}: no artifact id or SHA256 digest")
              picked.append((artifact_id, name, digest[len("sha256:"):]))
          kernels = [name for _, name, _ in picked if name.startswith("1-KERNEL_")]
          if len(kernels) != len(variants):
              raise SystemExit(f"Expected one 1-KERNEL_ download per variant ({len(variants)}), found {len(kernels)}; "
                               "downloads expire 7 days after the build")
          Path("numbered.tsv").write_text("".join("\t".join(item) + "\n" for item in picked))
          print("Verified", len(variants), "successful matrix build(s);", len(picked), "download(s) to release")
          PY
          while IFS=$'\t' read -r artifact_id name digest; do
            gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > "release-files/$name"
          done < numbered.tsv
          python3 - <<'PY'
          import hashlib, io, zipfile
          from pathlib import Path
          for line in Path("numbered.tsv").read_text().splitlines():
              _, name, digest = line.split("\t")
              path = Path("release-files") / name
              data = path.read_bytes()
              # An unarchived artifact may still arrive wrapped in a ZIP holding only itself.
              if hashlib.sha256(data).hexdigest() != digest and zipfile.is_zipfile(io.BytesIO(data)):
                  with zipfile.ZipFile(io.BytesIO(data)) as wrapper:
                      if wrapper.namelist() == [name]:
                          data = wrapper.read(name)
                          path.write_bytes(data)
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"{name}: SHA256 does not match the build's artifact digest {digest}")
              print("Verified", name)
          PY

      - name: Validate flash ZIPs and generate checksums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          files = sorted(Path("release-files").iterdir())
          if not any(path.name.startswith("1-KERNEL_") for path in files):
              raise SystemExit("No kernel ZIP to release")
          for path in files:
              with zipfile.ZipFile(path) as archive:  # .zip and .apk are both ZIP files
                  names = archive.namelist()
                  if path.name.startswith("1-KERNEL_"):
                      if "anykernel.sh" not in names or "Image" not in names:
                          raise SystemExit(f"{path.name}: invalid AnyKernel root")
                      if any(n.lower().endswith((".zip", ".7z", ".rar")) for n in names):
                          raise SystemExit(f"{path.name}: nested archive detected")
                  if archive.testzip():
                      raise SystemExit(f"{path.name}: corrupt archive")
              print("Validated", path.name)
          PY
          cd release-files
          sha256sum -- * > ../checksums.txt
          mv ../checksums.txt checksums.txt

      - name: Read release name from the build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Every matrix job writes the same RELEASE (vYY.MM.DD-rN) to its build-env artifact;
          # all of them are kept for the component versions in the notes.
          gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("build-env-"))) | .name' > env-names.txt
          [ -s env-names.txt ] || { echo "::error::No unexpired build-env artifact in run $SOURCE_RUN"; exit 1; }
          while IFS= read -r name; do
            gh run download "$SOURCE_RUN" --repo "$REPO" --name "$name" --dir "build-env/$name"
          done < env-names.txt
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          files = sorted(Path("build-env").rglob("build-env-*.txt"))
          if not files:
              raise SystemExit("build-env file missing")
          found = {tuple(dict(line.split("=", 1) for line in path.read_text().splitlines() if "=" in line)
                         .get(key, "") for key in ("RELEASE", "RELEASE_NAME")) for path in files}
          if len(found) != 1:
              raise SystemExit(f"Build variants disagree on the release name: {sorted(found)}")
          release, name = found.pop()
          # Tags like v26.10.16-r15 keep the README release badge (filter v*) pointing at real releases.
          if not re.fullmatch(r"v\d{2}\.\d{2}\.\d{2}(-r\d+)+", release):
              raise SystemExit(f"Unexpected RELEASE value {release!r}")
          if not re.fullmatch(r"[A-Za-z0-9 ._+()-]+", name):
              raise SystemExit(f"Unexpected RELEASE_NAME value {name!r}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"RELEASE_TAG={release}\nRELEASE_TITLE={name}\n")
          print("Release", release, "-", name)
          PY

      - name: Read the pins of the source commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p source-pins
          for file in upstream.lock ksun-susfs-6.1-features.lock.json; do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$REPO/contents/configs/$file?ref=$SOURCE_SHA" > "source-pins/$file"
          done

      - name: Collect what's new since the previous release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Previous published Cogan release (tag v*), other than the one being made or replaced.
          prev_tag="$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select((.tag_name | startswith("v")) and (.draft | not)) | [.created_at, .tag_name] | @tsv' \
            | awk -F'\t' -v tag="$RELEASE_TAG" '$2 != tag' | sort -r | head -n 1 | cut -f2)"
          prev_source=""
          if [ -n "$prev_tag" ]; then
            body="$(gh api "repos/$REPO/releases/tags/$prev_tag" --jq '.body // ""')"
            prev_source="$(sed -nE 's/.*cogan-source: ([0-9a-f]{40}).*/\1/p' <<<"$body" | head -n 1)"
            if [ -z "$prev_source" ]; then
              short="$(sed -nE 's/.*commit `([0-9a-f]{8})`.*/\1/p' <<<"$body" | head -n 1)"
              prev_source="$( { [ -n "$short" ] && git rev-parse --verify --quiet "$short^{commit}"; } \
                || gh api "repos/$REPO/commits/$prev_tag" --jq .sha)"
            fi
          fi
          if [ -z "$prev_tag" ]; then
            git log --format=%B "$SOURCE_SHA" > commit-log.txt
          elif git merge-base --is-ancestor "$prev_source" "$SOURCE_SHA" 2>/dev/null; then
            git log --format=%B "$prev_source..$SOURCE_SHA" > commit-log.txt
          else
            : > commit-log.txt  # unknown range: only docs/whats-new/<tag>.md can add news
          fi
          echo "Previous release: ${prev_tag:-none} (${prev_source:0:8}); $(grep -cE '^(Baru|Diperbaiki):' commit-log.txt || true) news line(s)"

      - name: Create release (draft, pre-release or release)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          REPLACE: ${{ inputs.ganti_rilis }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          replaced="no"
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [ "$REPLACE" != "true" ]; then
              echo "::error::Release $RELEASE_TAG already exists; tick 'ganti_rilis' to replace it"
              exit 1
            fi
            # Owner chose to replace it: the old release and its tag go, the new one is created below.
            gh release delete "$RELEASE_TAG" --repo "$REPO" --cleanup-tag --yes
            replaced="yes"
          fi
          case "$RELEASE_TYPE" in
            Draft) mode=(--draft --prerelease); shown="Draft (belum tampil / not published)" ;;
            Pre-release) mode=(--prerelease); shown="Pre-release (tampil / published as pre-release)" ;;
            Release) mode=(--latest); shown="Release (tampil sebagai rilis resmi / published as latest release)" ;;
            *) echo "::error::Unknown release type $RELEASE_TYPE"; exit 1 ;;
          esac
          # GitHub refuses a GITHUB_TOKEN tag on a commit whose .github/workflows differs from
          # the current one (HTTP 403 "Resource not accessible by integration"), so such a
          # build is tagged on the commit this release runs from, and the notes say so.
          workflows_at() { gh api "repos/$REPO/contents/.github?ref=$1" --jq '.[] | select(.name == "workflows") | .sha'; }
          built_workflows="$(workflows_at "$SOURCE_SHA")"
          current_workflows="$(workflows_at "$GITHUB_SHA")"
          [ -n "$built_workflows" ] && [ -n "$current_workflows" ] || { echo "::error::Cannot read .github/workflows"; exit 1; }
          target="$SOURCE_SHA"
          if [ "$built_workflows" != "$current_workflows" ]; then
            target="$GITHUB_SHA"
          fi
          {
            python3 scripts/release_notes.py --lock source-pins/upstream.lock \
              --features-lock source-pins/ksun-susfs-6.1-features.lock.json \
              --source-sha "$SOURCE_SHA" --repo "$REPO" --env-dir build-env --files release-files \
              --whats-new-file "docs/whats-new/$RELEASE_TAG.md" --commit-log commit-log.txt \
              --title "$RELEASE_TITLE" --release-type "$RELEASE_TYPE" --telegram-out telegram.txt
            echo ""
            echo "> [!CAUTION]"
            echo "> 🇮🇩 Hanya struktur ZIP yang divalidasi; boot di perangkat **belum diuji**. Simpan \`boot.img\` stock sebelum flash: [Panduan Bootloop]($SERVER/$REPO/blob/HEAD/docs/bootloop.md)."
            echo "> 🇬🇧 Only the ZIP structure was validated; device boot is **not tested**. Keep your stock \`boot.img\` before flashing: [Bootloop Guide]($SERVER/$REPO/blob/HEAD/docs/bootloop.en.md)."
            echo ""
            echo "<details>"
            echo "<summary>📋 Teks untuk Telegram (salin) / Telegram text (copy)</summary>"
            echo ""
            echo '```text'
            cat telegram.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            footer="Dibangun dari / built from run [$SOURCE_RUN]($SERVER/$REPO/actions/runs/$SOURCE_RUN), commit \`${SOURCE_SHA:0:8}\`."
            if [ "$target" != "$SOURCE_SHA" ]; then
              footer="$footer Tag di / tagged at \`${target:0:8}\` (\`dev\` saat rilis): GitHub menolak tag bot di commit lama / GitHub refuses a bot tag on an older commit."
            fi
            echo "<sub>$footer</sub>"
            echo ""
            echo "<!-- cogan-source: $SOURCE_SHA -->"
          } > release-notes.md
          gh release create "$RELEASE_TAG" release-files/* \
            --repo "$REPO" --target "$target" "${mode[@]}" \
            --title "$RELEASE_TITLE" --notes-file release-notes.md
          {
            echo "## Manual release"
            echo "- Tag: \`$RELEASE_TAG\` — $RELEASE_TITLE"
            echo "- Jenis / type: **$shown**"
            echo "- Tag di commit / tagged at \`${target:0:8}\`, kernel dari / built from \`${SOURCE_SHA:0:8}\`"
            echo "- Rilis lama diganti / replaced an existing release: $replaced"
            echo "- File: $(cd release-files && ls | sed 's/^/`/; s/$/`/' | paste -sd ' ' -)"
            echo "- Sumber / source run: $SOURCE_RUN (belum diuji di perangkat / not device-tested)"
            echo ""
            echo "### 📋 Teks untuk Telegram (salin)"
            echo '```text'
            cat telegram.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
