name: Validate

on:
  push:
    # Only dev: work branches are checked by their pull request, so a change is
    # validated twice (PR, then dev) instead of three times.
    branches:
      - dev
    # Skip pushes that only touch prose or images. docs/validation/*.json is
    # read by scripts/ksun_susfs_preflight.py, so it is not ignored. Pull
    # requests always run so a required check never stays pending.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**.png'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate workflows, shell scripts, and Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate GitHub workflows
        run: python3 .github/scripts/validate_workflows.py

      - name: Validate shell scripts
        run: python3 .github/scripts/validate_shell.py

      - name: Validate Python syntax
        run: python3 .github/scripts/validate_python.py

      - name: Check root matrix, early guard, and source provenance offline
        run: |
          python3 tests/test_root_matrix.py
          python3 -m unittest discover -s tests -p 'test_ksun_susfs_preflight.py'
          python3 -m unittest discover -s tests -p 'test_ksun_susfs_replay.py'
          python3 -m unittest discover -s tests -p 'test_ksun_susfs_sublevel.py'
          python3 -m unittest discover -s tests -p 'test_kmi_compat.py'
          python3 -m unittest discover -s tests -p 'test_ksun_susfs_resolved_config.py'
          python3 -m unittest discover -s tests -p 'test_cogan_manual_update.py'
          python3 -m unittest discover -s tests -p 'test_prepare_downloads.py'
          python3 -m unittest discover -s tests -p 'test_brand_anykernel.py'
          python3 -m unittest discover -s tests -p 'test_kernel_features.py'
          python3 -m unittest discover -s tests -p 'test_release_notes.py'
          python3 -m unittest discover -s tests -p 'test_manual_release.py'
          python3 -m unittest discover -s tests -p 'test_delete_old_runs.py'
          python3 -m unittest discover -s tests -p 'test_prepare_susfs_kernel_patch.py'
          python3 -m unittest discover -s tests -p 'test_prepare_susfs_synthetic.py'
          python3 -m unittest discover -s tests -p 'test_prepare_ksun_susfs_candidate.py'
