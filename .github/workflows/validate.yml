name: Validate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate workflows, shell scripts, and Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate GitHub workflows
        run: python3 .github/scripts/validate_workflows.py

      - name: Validate shell scripts
        run: python3 .github/scripts/validate_shell.py

      - name: Validate Python syntax
        run: python3 .github/scripts/validate_python.py

      - name: Check root matrix, early guard, and source provenance offline
        run: |
          python3 tests/test_root_matrix.py
          python3 -m unittest discover -s tests -p 'test_root_provenance.py'
          python3 -m unittest discover -s tests -p 'test_ksun_susfs_preflight.py'
