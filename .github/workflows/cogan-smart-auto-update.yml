name: Cogan Manual Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    name: Check component revisions (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cogan dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Check upstream revisions and local patch fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import subprocess

          rows = []
          observed = {}
          sources = [
              ("Kernel GKI 6.1", "https://github.com/ahmed-alnassif/GKI-Duchamp-6.1.git", "GKID-6.1"),
              ("KernelSU", "https://github.com/tiann/KernelSU.git", "main"),
              ("KernelSU Next", "https://github.com/KernelSU-Next/KernelSU-Next.git", "main"),
              ("BakaSU", "https://github.com/Baka-SU/BakaSU.git", "main"),
              ("NoMount", "https://github.com/maxsteeel/nomount.git", "master"),
              ("AnyKernel", "https://github.com/ahmed-alnassif/AK3-GKID.git", "HEAD"),
          ]
          for name, url, branch in sources:
              try:
                  ref = "HEAD" if branch == "HEAD" else "refs/heads/" + branch
                  result = subprocess.run(
                      ["git", "ls-remote", "--exit-code", url, ref],
                      capture_output=True, text=True, timeout=35, check=True
                  )
                  sha = result.stdout.split()[0]
                  if len(sha) != 40:
                      raise ValueError("Invalid upstream SHA")
                  observed[name] = sha
                  rows.append((name, branch, sha[:12], "Found; compatibility not verified"))
              except (subprocess.SubprocessError, ValueError) as exc:
                  rows.append((name, branch, "-", "Unavailable / check upstream manually"))

          # Source revision discovery only; KSUN build currently pins tag v3.4.2.
          # Do not treat upstream branch HEAD as an approved update.
          local_files = [
              ("Networking / BBRv3", ["kernel-patches/bbrv3/bbrv3.patch", "configs/custom.config"]),
              ("Clean LTO", ["configs/gki_defconfig.sh", "build.sh"]),
          ]
          for label, paths in local_files:
              missing = [p for p in paths if not pathlib.Path(p).is_file()]
              if missing:
                  rows.append((label, "Cogan local", "-", "MISSING: " + ", ".join(missing)))
                  continue
              digest = hashlib.sha256()
              for name in paths:
                  file = pathlib.Path(name)
                  digest.update(name.encode())
                  digest.update(file.read_bytes())
              rows.append((label, "Cogan local", digest.hexdigest()[:12], "Local files only; compatibility unverified"))

          output = [
              "## Cogan Manual Update — Check Only / Pemeriksaan Saja",
              "",
              "<details open><summary>🇮🇩 Bahasa Indonesia — Ringkasan</summary>",
              "",
              "Pemeriksaan hanya dijalankan manual oleh owner. Tidak ada jadwal, commit, PR, release, kompilasi, atau pembaruan otomatis.",
              "",
              "**Status:** Perbedaan revisi belum membuktikan kompatibilitas. SUSFS tetap **HOLD**; jangan menerapkan pembaruan sebelum validasi.",
              "",
              "</details>",
              "",
              "<details><summary>🇬🇧 English — Summary</summary>",
              "",
              "Owner-triggered manual inspection only. No schedule, commits, PRs, releases, builds, or automatic updates.",
              "",
              "**Status:** Different revisions do not prove compatibility. SUSFS remains **ON HOLD**; do not apply updates before validation.",
              "",
              "</details>",
              "",
              "| Component | Reference | Revision / fingerprint | Status |",
              "|---|---|---|---|",
          ]
          for row in rows:
              output.append("| " + " | ".join(row) + " |")
          # Compare against the actual Cogan build pin; other sources are floating
          # and cannot be labelled up-to-date without recording a prior build SHA.
          build_script = pathlib.Path("build.sh").read_text()
          pin_match = re.search(r'^\s*KSUN_REF="([^"]+)"', build_script, re.MULTILINE)
          ksun_tag = pin_match.group(1) if pin_match else ""
          if not ksun_tag:
              raise SystemExit("KSUN_REF missing in build.sh; cannot verify current pin")
          try:
              pinned = subprocess.run(
                  ["git", "ls-remote", "--tags",
                   "https://github.com/KernelSU-Next/KernelSU-Next.git",
                   "refs/tags/" + ksun_tag, "refs/tags/" + ksun_tag + "^{}"],
                  capture_output=True, text=True, timeout=35, check=True
              )
              tag_lines = [line.split() for line in pinned.stdout.splitlines()]
              peeled = [sha for sha, ref in tag_lines if ref.endswith("^{}")]
              pinned_sha = peeled[0] if peeled else (tag_lines[0][0] if tag_lines else "")
          except subprocess.SubprocessError:
              pinned_sha = ""
          current = pinned_sha[:12] if pinned_sha else "unavailable"
          available = observed.get("KernelSU Next", "")[:12] or "unavailable"
          comparison = "DIFFERENT REVISION; REVIEW" if pinned_sha and available != "unavailable" and pinned_sha[:12] != available else "NO CHANGE DETECTED" if pinned_sha and available != "unavailable" else "UNKNOWN"
          output += [
              "",
              "### Referensi build saat ini → upstream / Current build reference → upstream",
              "",
              "| Component | Cogan build reference | Upstream branch | Assessment |",
              "|---|---|---|---|",
              "| KernelSU Next | " + ksun_tag + " (" + current + ") | " + available + " | " + comparison + " |",
              "| Kernel / KernelSU / BakaSU / NoMount | Floating or locally configured refs | See revision table | No baseline snapshot; review manually |",
              "",
              "Different commits do not establish that the upstream revision is newer or compatible.",
          ]
          output += [
              "",
              "### Pemeriksaan kompatibilitas / Compatibility assessment",
              "",
              "| Pemeriksaan / Check | Hasil / Result | Penjelasan / Explanation |",
              "|---|---|---|",
              "| Kernel source + selected sublevel | NEEDS REVIEW | Upstream revision does not establish GKI/Android ABI compatibility |",
              "| Root manager driver + manager app | NEEDS REVIEW | Driver API and manager version must be checked together |",
              "| Networking / BBRv3 + kernel | NEEDS REVIEW | Fingerprint is not a patch application test |",
              "| NoMount + Clean LTO + kernel | NEEDS REVIEW | Fingerprint is not a build or boot test |",
              "| SUSFS + root manager | BLOCKED | Integration remains on hold |",
              "",
              "ID: Tidak ada komponen berstatus COMPATIBLE tanpa bukti pengujian build/runtime. EN: No component is marked COMPATIBLE without verified build/runtime evidence.",
              "",
          ]
          output += [
              "",
              "**KernelSU Next build pin:** " + ksun_tag + "; upstream branch HEAD is informational only.",
              "**SUSFS: HOLD.** No automatic update or compatibility approval.",
              "",
              "**Important:** Upstream SHA discovery does not prove that a revision is safe or compatible. "
              "This workflow does not apply updates; owner review is required.",
          ]
          report = "\n".join(output) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write(report)
          print(report)
          PY
