name: Cogan Manual Update

# The only way Cogan components get updated: root managers, SUSFS, NoMount,
# Baseband Guard (BBG), AnyKernel3, the Neutron clang toolchain and the GKID 6.1 kernel source (scope: kernel 6.1 only). Pins live
# in configs/upstream.lock.
# The kernel build workflow only compiles those exact commits.
#   check  : report pinned vs latest upstream (no changes)
#   update : bump the selected pins and commit them straight to dev, so the next
#            build run uses them (a pull request is opened only if the push is refused)
on:
  workflow_dispatch:
    inputs:
      MODE:
        description: "check = laporan saja / report only; update = terapkan pin baru langsung ke dev"
        type: choice
        default: "check"
        options:
          - "check"
          - "update"
      COMPONENTS:
        description: "Komponen / Components"
        type: choice
        default: "all"
        options:
          - "all"
          - "root-managers"
          - "susfs"
          - "nomount"
          - "bbg"
          - "anykernel"
          - "kernel-6.1"
          - "toolchain"

permissions:
  contents: read

concurrency:
  group: cogan-manual-update
  cancel-in-progress: false

jobs:
  manual-update:
    name: Cogan Manual Update (${{ github.event.inputs.MODE }}, ${{ github.event.inputs.COMPONENTS }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Cogan dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: ${{ github.event.inputs.MODE == 'update' }}

      - name: Compare pins with upstream
        env:
          MODE: ${{ github.event.inputs.MODE }}
          COMPONENTS: ${{ github.event.inputs.COMPONENTS }}
        run: |
          python3 scripts/cogan_manual_update.py --mode "$MODE" --components "$COMPONENTS" \
            --summary "$GITHUB_STEP_SUMMARY" --changes "$RUNNER_TEMP/changes.txt"

      - name: Apply the new pins to dev
        if: github.event.inputs.MODE == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS: ${{ github.event.inputs.COMPONENTS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/changes.txt" ]; then
            echo "No pin changes for '$COMPONENTS'; dev already uses the latest pins." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="chore: Cogan Manual Update ($COMPONENTS), run ${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/upstream.lock
          git commit -q -m "$title" -m "$(cat "$RUNNER_TEMP/changes.txt")" -m "Run: $RUN_URL"
          if git push -q origin HEAD:dev; then
            echo "**Applied to dev** ($(git rev-parse --short HEAD)). The next Cogan Kernel Builder run uses these pins." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::Direct push to dev was refused (branch rules or a newer dev); opening a pull request instead."
          branch="manual-update/run-${GITHUB_RUN_NUMBER}"
          git switch -q -c "$branch"
          if ! git push -q origin "$branch"; then
            echo "::error::Push of $branch was refused too. The updated lock is attached as artifact 'upstream-lock'."
            exit 1
          fi
          {
            echo "Pin baru dari **Cogan Manual Update** ($COMPONENTS). Run: $RUN_URL"
            echo
            echo "Push langsung ke \`dev\` ditolak, jadi dibuat PR ini sebagai cadangan."
            echo
            echo '```'
            cat "$RUNNER_TEMP/changes.txt"
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"
          if ! gh pr create --base dev --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::error::Branch $branch was pushed, but creating the pull request failed. Enable 'Allow GitHub Actions to create and approve pull requests' or open it manually."
            exit 1
          fi

      - name: Attach updated lock
        if: always() && github.event.inputs.MODE == 'update'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-lock
          path: configs/upstream.lock
          retention-days: 7
