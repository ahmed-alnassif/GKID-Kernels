name: Cogan Smart Auto-Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    name: Check component revisions (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cogan dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Check upstream revisions and local patch fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess

          rows = []
          sources = [
              ("Kernel GKI 6.1", "https://github.com/ahmed-alnassif/GKI-Duchamp-6.1.git", "GKID-6.1"),
              ("KernelSU", "https://github.com/tiann/KernelSU.git", "main"),
              ("KernelSU Next", "https://github.com/KernelSU-Next/KernelSU-Next.git", "next"),
              ("BakaSU", "https://github.com/Baka-SU/BakaSU.git", "main"),
              ("NoMount", "https://github.com/maxsteeel/nomount.git", "master"),
          ]
          for name, url, branch in sources:
              try:
                  result = subprocess.run(
                      ["git", "ls-remote", "--exit-code", url, "refs/heads/" + branch],
                      capture_output=True, text=True, timeout=35, check=True
                  )
                  sha = result.stdout.split()[0]
                  if len(sha) != 40:
                      raise ValueError("Invalid upstream SHA")
                  rows.append((name, branch, sha[:12], "Found; compatibility not verified"))
              except (subprocess.SubprocessError, ValueError) as exc:
                  rows.append((name, branch, "-", "Unavailable / check upstream manually"))

          for label, directory in [
              ("Networking / BBRv3", "kernel-patches/bbrv3"),
              ("Clean LTO", "configs"),
          ]:
              folder = pathlib.Path(directory)
              files = sorted(p for p in folder.rglob("*") if p.is_file()) if folder.exists() else []
              digest = hashlib.sha256()
              for file in files:
                  digest.update(file.as_posix().encode())
                  digest.update(file.read_bytes())
              rows.append((label, "Cogan local", digest.hexdigest()[:12] if files else "-", "Local fingerprint; no automatic upstream update"))

          output = [
              "## Cogan Smart Auto-Update — Check Only",
              "",
              "Owner-triggered read-only inspection. No commits, PRs, releases or builds.",
              "",
              "| Component | Reference | Revision / fingerprint | Status |",
              "|---|---|---|---|",
          ]
          for row in rows:
              output.append("| " + " | ".join(row) + " |")
          output += [
              "",
              "**SUSFS: HOLD.** No automatic update or compatibility approval.",
              "",
              "**Important:** Upstream SHA discovery does not prove that a revision is safe or compatible. "
              "This workflow does not apply updates; owner review is required.",
          ]
          report = "\n".join(output) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write(report)
          print(report)
          PY
