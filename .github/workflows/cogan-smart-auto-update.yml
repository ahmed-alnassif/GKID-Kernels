name: Cogan Manual Update

# The only way Cogan components get updated: root managers, SUSFS, NoMount,
# AnyKernel3 and the GKID 6.1 kernel source. Pins live in configs/upstream.lock.
# The kernel build workflow only compiles those exact commits.
#   check  : report pinned vs latest upstream (no changes)
#   update : bump the selected pins and open a pull request to dev for review
on:
  workflow_dispatch:
    inputs:
      MODE:
        description: "check = laporan saja / report only; update = PR pin baru ke dev"
        type: choice
        default: "check"
        options:
          - "check"
          - "update"
      COMPONENTS:
        description: "Komponen / Components"
        type: choice
        default: "all"
        options:
          - "all"
          - "root-managers"
          - "susfs"
          - "nomount"
          - "anykernel"
          - "kernel-6.1"

permissions:
  contents: read

concurrency:
  group: cogan-manual-update
  cancel-in-progress: false

jobs:
  manual-update:
    name: Cogan Manual Update (${{ github.event.inputs.MODE }}, ${{ github.event.inputs.COMPONENTS }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Cogan dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: ${{ github.event.inputs.MODE == 'update' }}

      - name: Compare pins with upstream
        env:
          MODE: ${{ github.event.inputs.MODE }}
          COMPONENTS: ${{ github.event.inputs.COMPONENTS }}
        run: |
          python3 scripts/cogan_manual_update.py --mode "$MODE" --components "$COMPONENTS" \
            --summary "$GITHUB_STEP_SUMMARY" --changes "$RUNNER_TEMP/changes.txt"

      - name: Open pull request with the new pins
        if: github.event.inputs.MODE == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS: ${{ github.event.inputs.COMPONENTS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/changes.txt" ]; then
            echo "No pin changes for '$COMPONENTS'; nothing to propose."
            exit 0
          fi
          branch="manual-update/run-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add configs/upstream.lock
          git commit -q -m "chore: Cogan Manual Update ($COMPONENTS), run ${GITHUB_RUN_NUMBER}" \
            -m "$(cat "$RUNNER_TEMP/changes.txt")"
          if ! git push -q origin "$branch"; then
            echo "::error::Push of $branch was refused (branch rules or token permissions). The updated lock is attached as artifact 'upstream-lock'."
            exit 1
          fi
          {
            echo "Pin baru dari **Cogan Manual Update** ($COMPONENTS). Run: $RUN_URL"
            echo
            echo '```'
            cat "$RUNNER_TEMP/changes.txt"
            echo '```'
            echo
            echo "Versi upstream yang lebih baru belum tentu kompatibel: merge, lalu jalankan build (owner) dan uji."
            echo "PR dari GITHUB_TOKEN tidak memicu Validate otomatis; jalankan Validate manual bila perlu."
          } > "$RUNNER_TEMP/pr-body.md"
          if ! gh pr create --base dev --head "$branch" \
              --title "chore: Cogan Manual Update ($COMPONENTS), run ${GITHUB_RUN_NUMBER}" \
              --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::error::Branch $branch was pushed, but creating the pull request failed. Enable 'Allow GitHub Actions to create and approve pull requests' or open it manually."
            exit 1
          fi

      - name: Attach updated lock
        if: always() && github.event.inputs.MODE == 'update'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-lock
          path: configs/upstream.lock
          retention-days: 7
