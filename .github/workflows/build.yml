name: GKI-Duchamp Builder
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      TODO:
        description: To do
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      TEST:
        description: debug the pipeline
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

      LTO:
        description: enable LTO optimization
        default: "fullLTO"
        type: choice
        options:
          - "noneLTO"
          - "thinLTO"
          - "fullLTO"

      KERNEL_VERSION:
        description: "GKI LTS kernel line to build"
        default: "All"
        type: choice
        options:
          - "All"
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"

      BUILD_VANILLA:
        description: "Build Vanilla (no KSU)"
        type: boolean
        default: true

      BUILD_KSU:
        description: "Build with KernelSU"
        type: boolean
        default: true

      BUILD_KSUN:
        description: "Build with KernelSU-Next"
        type: boolean
        default: true

      BUILD_KSU_SUSFS:
        description: "Build with KernelSU and its forks (KernelSU Next) + SUSFS"
        type: boolean
        default: true

      CLEAN_LTO_CACHE:
        description: "Clean ThinLTO cache to fix .config bug"
        type: boolean
        default: true

      DROIDSPACES:
        description: "Enable droidspaces-oss support"
        type: boolean
        default: true

      NH:
        description: "Enable NetHunter support"
        type: boolean
        default: true

      NM:
        description: "Enable NoMount support"
        type: boolean
        default: true

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Run Build Script
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_REPO: https://github.com/ahmed-alnassif/GKI-Duchamp-6.1
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          KSU: ${{ matrix.KSU }}

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gh bc bison flex libssl-dev libelf-dev dwarves cpio
          pip install lxml

      - name: Cache ccache + LTO
        uses: actions/cache@v6.1.0
        id: ccache-cache
        with:
          path: |
            ~/.ccache
            /dev/shm/thinlto-cache
          key: ccache-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.name }}

      - name: Run Build Script
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_REPO: https://github.com/ahmed-alnassif/GKI-Duchamp-6.1
          KERNEL_VERSION: ${{ inputs.KERNEL_VERSION }}
          KSU: ${{ matrix.KSU }}
          KSU_COMPAT: ${{ matrix.KSU_COMPAT }}
          KSU_SUSFS: ${{ matrix.KSU_SUSFS }}
          C_LTO: ${{ matrix.C_LTO }}
          TODO: ${{ inputs.TODO }}
          TEST: ${{ inputs.TEST }}
          LTO: ${{ inputs.LTO }}
          CLEAN_LTO_CACHE: ${{ inputs.CLEAN_LTO_CACHE }}
          DROIDSPACES: ${{ inputs.DROIDSPACES }}
          NH: ${{ inputs.NH }}
          NM: ${{ inputs.NM }}
          BUILD_NAME: ${{ matrix.name }}
          RUN_NUM: -r${{ github.run_number }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          ./build.sh

      - name: Create KernelSU module for wireless modules
        if: ${{ inputs.NH }}
        run: |
          echo "Extracting wireless modules..."
          NAME="WirelessKSU"
          WKSU="modules/$NAME"
          RPWD=$(pwd)
          mkdir -p "$WKSU/lkm"
          mkdir -p "$WKSU/system/etc/firmware/rtw88"

          if [ -d "out/drivers/net/wireless/realtek/rtw88" ]; then

          for mod in rfkill cfg80211 mac80211; do
            find out/ -iname "$mod*.ko" -exec cp {} $WKSU/lkm/ \; 2>/dev/null || true
          done

            find out/drivers/net/wireless/realtek/rtw88 -name "*.ko" -exec cp {} $WKSU/lkm/ \;
            find out/drivers/staging/r8188eu -name "*.ko" -exec cp {} $WKSU/lkm/ \;

            if [ -n "$(ls -A $WKSU/lkm 2>/dev/null)" ]; then
                    sed -i "s/version=.*/version=${{ env.RELEASE }}-${{ matrix.kernel_version }}-${{ env.VARIANT }}/" "$WKSU/module.prop"
                    cp ksrc/drivers/net/wireless/realtek/rtw88/firmware/* "$WKSU/system/etc/firmware/rtw88"
                    echo "Modules found:"
                    ls -la $WKSU/lkm/
                    mkdir -p artifacts
                    cd $WKSU
                    # Kernel version must be part of the filename: the same
                    # variant name is reused across every GKI line in the
                    # "All Kernels" matrix, and release assets must be unique.
                    zip -9 -r "$RPWD/artifacts/$NAME-${{ matrix.kernel_version }}-${{ env.VARIANT }}-${{ env.RELEASE }}.zip" .
                    echo "$NAME-${{ matrix.kernel_version }}-${{ env.VARIANT }}-${{ env.RELEASE }}.zip created"
            else
                    echo "No .ko files found (driver may be built-in)"
            fi
          else
            echo "wireless directory not found (driver may not be built or is built-in)"
          fi

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats

      - name: Save environment for release
        if: always()
        run: |
          cat > build-env-${{ matrix.name }}.txt << EOF
          RELEASE_REPO=${{ env.RELEASE_REPO }}
          KERNEL_NAME=${{ env.KERNEL_NAME }}
          RELEASE_NAME=${{ env.RELEASE_NAME }}
          RELEASE=${{ env.RELEASE }}
          LINUX_VERSION=${{ env.LINUX_VERSION }}
          COMPILER_STRING=${{ env.COMPILER_STRING }}
          SUSFS_VERSION=${{ env.SUSFS_VERSION }}
          BASE_NAME=${{ env.BASE_NAME }}
          KSU=${{ matrix.KSU }}
          KSU_SUSFS=${{ matrix.KSU_SUSFS }}
          KERNEL_VERSION=${{ env.KERNEL_VERSION }}
          ANDROID_RELEASE=${{ env.ANDROID_RELEASE }}
          KERNEL_SOURCE_REPO=${{ env.KERNEL_SOURCE_REPO }}
          KERNEL_SOURCE_BRANCH=${{ env.KERNEL_SOURCE_BRANCH }}
          EOF

          echo "BUILD_VARIANT=${{ matrix.name }}" >> build-env-${{ matrix.name }}.txt
          echo "Saved environment for ${{ matrix.name }}"

      - name: Upload environment file
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-env-${{ matrix.name }}-${{ github.run_number }}
          path: build-env-${{ matrix.name }}.txt
          retention-days: 1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-${{ matrix.name }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 1

  upload-all:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: all-builds-${{ github.run_number }}
          retention-days: 7
          path: |
            downloaded-artifacts/artifacts/*.txt
            downloaded-artifacts/artifacts/*.zip

  release:
    needs: build
    if: github.event.inputs.TODO != 'defconfig'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum *.zip > checksums.txt
          md5sum *.zip > checksums-md5.txt

      - name: Load environment from builds and prepare release body
        env:
          TEST_INPUT: ${{ inputs.TEST }}
          DROIDSPACES_INPUT: ${{ inputs.DroidSpaces }}
          NH_INPUT: ${{ inputs.NH }}
          NM_INPUT: ${{ inputs.NM }}
          LTO_INPUT: ${{ inputs.LTO }}
        run: python3 .github/scripts/prepare_release.py

      - name: Upload All Builds to release repo
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE }}
          files: |
            release-artifacts/*.zip
            release-artifacts/checksums.txt
            release-artifacts/checksums-md5.txt
          body_path: release_body.md

      - name: Upload to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_NAME: ${{ env.RELEASE_NAME }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.RELEASE }}
          MULTI_KERNEL: ${{ env.MULTI_KERNEL }}
          KERNEL_VERSIONS: ${{ env.KERNEL_VERSIONS }}
          KERNEL_VERSION: ${{ env.KERNEL_VERSION }}
          ANDROID_RELEASE: ${{ env.ANDROID_RELEASE }}
        run: |
          set -euo pipefail

          [[ -n "$BOT_TOKEN" ]] || { echo "::error::BOT_TOKEN is not set"; exit 1; }
          [[ -n "$CHAT_ID" ]] || { echo "::error::CHAT_ID is not set"; exit 1; }
          [[ -n "$TOPIC_ID" ]] || { echo "::error::TOPIC_ID is not set"; exit 1; }

          # MULTI_KERNEL/KERNEL_VERSIONS/KERNEL_VERSION/ANDROID_RELEASE come
          # from prepare_release.py's export_github_env(). ANDROID_RELEASE
          # is only set when a single line was built.
          RELEASE_NAME=$(python3 .github/scripts/markdown_to_telegram.py --escape "$RELEASE_NAME")

          read_or_default() {
          if [[ -f "$1" ]]; then
              python3 .github/scripts/markdown_to_telegram.py "$1"
            else
              echo "Not available"
            fi
          }

          if [[ "$MULTI_KERNEL" == "true" ]]; then
            # Several GKI lines were built in this run; a full per-line
            # changelog dump doesn't fit a Telegram message, so point to
            # the GitHub release notes instead.
            LINES_ESCAPED=$(printf '%s' "$KERNEL_VERSIONS" | sed -e 's/\./\\./g' -e 's/,/, /g')

            CAPTION=$(cat <<EOF
          **$RELEASE_NAME**

          **GKI lines built:** $LINES_ESCAPED

          Full per\-line changelogs and downloads are on the release page\.

          [**Download**]($RELEASE_URL)

          [**Support the project**](https://github.com/ahmed-alnassif/GKI-Duchamp#-support-this-project)

          [Commit]($COMMIT_URL) • [CI \#$RUN_NUMBER]($RUN_URL)
          EOF
            )
          else
            KERNEL_VERSION="${KERNEL_VERSION:-6.1}"
            ANDROID_RELEASE="${ANDROID_RELEASE:-14}"

            # MarkdownV2-escape the "AndroidNN-K.V-LTS" label and bare kernel
            # version for use inside the heredocs below.
            KERNEL_LABEL_ESCAPED=$(printf '%s' "Android${ANDROID_RELEASE}-${KERNEL_VERSION}-LTS" | sed -e 's/\./\\./g' -e 's/-/\\-/g')
            KERNEL_VERSION_ESCAPED=$(printf '%s' "$KERNEL_VERSION" | sed 's/\./\\./g')

            CHANGELOG_BODY=$(cat <<INNER
          What's new:
          **${KERNEL_LABEL_ESCAPED}:**
          $(read_or_default "release-artifacts/android_kernel-${KERNEL_VERSION}_changelog.txt")

          \-\-\-
          **SuSFS:**
          $(read_or_default "release-artifacts/susfs_changelog-${KERNEL_VERSION}.txt")

          \-\-\-
          **NoMount:**
          $(read_or_default "release-artifacts/nomount_changelog.txt")

          \-\-\-
          **KernelSU:**
          $(read_or_default "release-artifacts/ksu_changelog.txt")

          \-\-\-
          **ReSukiSU:**
          $(read_or_default "release-artifacts/ReSukiSU_changelog.txt")

          \-\-\-
          **KernelSU Next:**
          $(read_or_default "release-artifacts/ksun_changelog.txt")
          INNER
            )

            CHANGELOG_QUOTED=$(printf '%s\n' "$CHANGELOG_BODY" | sed 's/^[[:space:]]*//' | awk '
              NR==1 { print "**>" $0; next }
              { lines[NR] = $0 }
              END {
                for (i = 2; i <= NR; i++) {
                  if (i == NR) print ">" lines[i] "||"
                  else print ">" lines[i]
                }
              }
            ')

            CAPTION=$(cat <<EOF
          **$RELEASE_NAME**

          **Supported devices:**
          All devices that shipped with **Linux ${KERNEL_VERSION_ESCAPED}\.x** and **Android ${ANDROID_RELEASE}** \(stock or AOSP\)

          $CHANGELOG_QUOTED

          [**Download**]($RELEASE_URL)

          [**Support the project**](https://github.com/ahmed-alnassif/GKI-Duchamp#-support-this-project)

          [Commit]($COMMIT_URL) • [CI \#$RUN_NUMBER]($RUN_URL)
          EOF
            )
          fi

          CAPTION=$(printf '%s\n' "$CAPTION" | sed 's/^[[:space:]]*//')

          curl --fail-with-body -sS \
            -F "chat_id=$CHAT_ID" \
            -F "message_thread_id=$TOPIC_ID" \
            -F "photo=@docs/banner.png" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendPhoto"

          curl --fail-with-body -sS \
            -F "chat_id=$CHAT_ID" \
            -F "message_thread_id=$TOPIC_ID" \
            -F "text=$CAPTION" \
            -F "parse_mode=MarkdownV2" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
