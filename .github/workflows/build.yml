name: Cogan Kernel Builder
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      ROOT_MANAGER:
        description: "Root Manager"
        type: choice
        default: "KernelSU"
        options:
          - "KernelSU"
          - "KernelSU Next"
          - "KernelSU Next + SUSFS (uji)"
          - "KernelSU + SUSFS"
          - "BakaSU + SUSFS"
          - "Vanilla"
          - "All variants (advanced)"

      BUILD_MODE:
        description: "Build Mode"
        default: "Standard Build"
        type: choice
        options:
          - "Standard Build"

      LTO:
        description: "LTO Package"
        default: "fullLTO + NoMount + Clean LTO"
        type: choice
        options:
          - "noneLTO + NoMount + Clean LTO"
          - "thinLTO + NoMount + Clean LTO"
          - "fullLTO + NoMount + Clean LTO"

      KERNEL_VERSION:
        description: "Kernel Version"
        default: "6.1"
        type: choice
        options:
          - "All"
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"

      BUILD_REVISION:
        description: "Build Revision"
        type: string
        default: ""

      KERNEL_SUBLEVEL:
        description: "Kernel Sublevel: lts = terbaru, atau angka saja (mis. 177, bukan 6.1.177). Tersedia 6.1.160 ke atas"
        type: string
        default: "lts"

      BUILD_TIME:
        description: "Build Time"
        type: string
        default: "N"

      NETWORKING:
        description: "Networking"
        type: boolean
        default: true

      BBG:
        description: "BBG (Baseband Guard anti-bricking)"
        type: boolean
        default: true

# Legacy workflow (Edo Tensei): former TODO and TEST inputs are retired.
# Standard Build is the sole supported mode: TODO=kernel, TEST=no.
# LTO package labels map to legacy LTO values; NM=true and CLEAN_LTO_CACHE=true stay fixed.
# Keep the underlying build script's TODO/TEST variables for compatibility.
env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  ensure-cache-release:
    name: Ensure ccache release exists
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Create persistent cache release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view ci-ccache-store --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ci-ccache-store already exists"
          else
            echo "Creating ci-ccache-store release"
            gh release create ci-ccache-store \
              --repo "${{ github.repository }}" \
              --title "CI ccache store (internal - do not delete)" \
              --notes "Persistent compiler cache used by the build workflow. Each build matrix entry keeps one asset here (ccache-<variant>.tar.zst). Safe to delete if you want to force a cold cache for everything; the workflow recreates this release and rebuilds the caches automatically, just slower for the next run per variant." \
              --prerelease \
              --latest=false
          fi

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Validate sublevel, build time and optional features
        id: validation
        env:
          ROOT_MANAGER_INPUT: ${{ inputs.ROOT_MANAGER }}
          KERNEL_VERSION_INPUT: ${{ inputs.KERNEL_VERSION }}
          KERNEL_SUBLEVEL_INPUT: ${{ inputs.KERNEL_SUBLEVEL }}
          BUILD_TIME_INPUT: ${{ inputs.BUILD_TIME }}
          LTO_INPUT: ${{ inputs.LTO }}
          BBG_INPUT: ${{ inputs.BBG }}
        run: |
          set -euo pipefail
          if [[ "$ROOT_MANAGER_INPUT" == "KernelSU Next + SUSFS (uji)" ]]; then
            # Test build of the validated isolated candidate only (Issue #19); never a release.
            [[ "$KERNEL_VERSION_INPUT" == "6.1" && "${LTO_INPUT:-}" == fullLTO* && "${BBG_INPUT:-true}" == "true" ]] \
              || { echo "::error::KSUN+SUSFS (uji) needs kernel 6.1, a fullLTO package and BBG enabled" >&2; exit 1; }
            case "$(echo "${KERNEL_SUBLEVEL_INPUT:-}" | tr '[:upper:]' '[:lower:]')" in
              lts|auto|""|177) ;;
              *) echo "::error::KSUN+SUSFS (uji) is only available for 6.1.177 (lts)" >&2; exit 1 ;;
            esac
          fi
          # "lts" (any case), "Auto" or empty mean the latest pinned sublevel.
          SUBLEVEL="${KERNEL_SUBLEVEL_INPUT:-}"
          case "${SUBLEVEL,,}" in auto|lts|"") SUBLEVEL="Auto" ;; esac
          if [[ "$SUBLEVEL" != "Auto" ]]; then
            [[ "$KERNEL_VERSION_INPUT" == "6.1" ]] || { echo "::error::A specific sublevel requires kernel 6.1"; exit 1; }
            [[ "$SUBLEVEL" =~ ^[0-9]+$ ]] || { echo "::error::Sublevel must be lts or a number such as 177 (not 6.1.177)"; exit 1; }
            # Available sublevels are the pinned ones in configs/upstream.lock.
            available="$(sed -n 's/^KERNEL_COMMIT_6_1_\([0-9][0-9]*\)=.*/\1/p' configs/upstream.lock | sort -n | tr '\n' ' ')"
            grep -q "^KERNEL_COMMIT_6_1_${SUBLEVEL}=" configs/upstream.lock || { echo "::error::Sublevel 6.1.${SUBLEVEL} is not available. Available: lts ${available}"; exit 1; }
          fi
          if [[ "$BUILD_TIME_INPUT" != "N" ]]; then
            [[ "$BUILD_TIME_INPUT" =~ ^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[[:space:]](Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[[:space:]][0-9]{1,2}[[:space:]][0-9]{2}:[0-9]{2}:[0-9]{2}[[:space:]]UTC[[:space:]][0-9]{4}$ ]] || { echo "::error::Invalid BUILD_TIME format"; exit 1; }
            date -u -d "$BUILD_TIME_INPUT" >/dev/null || exit 1
            [[ "$(LC_ALL=C date -u -d "$BUILD_TIME_INPUT" +%a)" == "${BUILD_TIME_INPUT%% *}" ]] || { echo "::error::BUILD_TIME weekday mismatch"; exit 1; }
          fi

      - name: Validation result summary
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          ROOT_MANAGER_INPUT: ${{ inputs.ROOT_MANAGER }}
          KERNEL_VERSION_INPUT: ${{ inputs.KERNEL_VERSION }}
          KERNEL_SUBLEVEL_INPUT: ${{ inputs.KERNEL_SUBLEVEL }}
          BUILD_TIME_INPUT: ${{ inputs.BUILD_TIME }}
        run: |
          {
            echo "## Cogan Kernel — Validation Summary"
            echo ""
            echo "<details open><summary>🇮🇩 Bahasa Indonesia</summary>"
            echo ""
            echo "- Root manager: ${ROOT_MANAGER_INPUT}"
            echo "- Kernel: ${KERNEL_VERSION_INPUT} / sublevel ${KERNEL_SUBLEVEL_INPUT}"
            echo "- Build time: ${BUILD_TIME_INPUT}"
            echo "- Status validasi: ${VALIDATION_OUTCOME}"
            if [[ "${VALIDATION_OUTCOME}" != "success" ]]; then
              echo ""
              echo "**Persiapan gagal; kompilasi tidak dijalankan.**"
              if [[ "${ROOT_MANAGER_INPUT}" == "KernelSU Next + SUSFS (uji)" ]]; then
                echo "KSUN + SUSFS (uji) hanya untuk kernel 6.1.177 (lts), paket fullLTO dan BBG aktif."
              else
                echo "Periksa pesan error pertama pada langkah **Validate sublevel, build time and optional features**."
              fi
            else
              echo ""
              echo "Validasi input berhasil; ini **bukan** bukti kompilasi berhasil."
            fi
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>🇬🇧 English</summary>"
            echo ""
            echo "- Root manager: ${ROOT_MANAGER_INPUT}"
            echo "- Kernel: ${KERNEL_VERSION_INPUT} / sublevel ${KERNEL_SUBLEVEL_INPUT}"
            echo "- Build time: ${BUILD_TIME_INPUT}"
            echo "- Validation: ${VALIDATION_OUTCOME}"
            if [[ "${VALIDATION_OUTCOME}" != "success" ]]; then
              echo ""
              echo "**Preparation failed; no kernel compilation ran.**"
              if [[ "${ROOT_MANAGER_INPUT}" == "KernelSU Next + SUSFS (uji)" ]]; then
                echo "KSUN + SUSFS (uji) is only available for kernel 6.1.177 (lts), a fullLTO package and BBG enabled."
              else
                echo "Inspect the first error in **Validate sublevel, build time and optional features**."
              fi
            else
              echo ""
              echo "Input validation passed; this does **not** prove a successful build."
            fi
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate build matrix
        id: set-matrix
        env:
          KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}
          ROOT_MANAGER: ${{ inputs.ROOT_MANAGER }}
        run: |
          python3 py/generate-matrix.py >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, ensure-cache-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev ccache gh bc bison flex libssl-dev libelf-dev dwarves cpio zstd
          pip install lxml

      - name: Restore ccache from release
        if: inputs.BUILD_MODE == 'Standard Build'
        id: restore-ccache
        uses: ./.github/actions/ccache-restore
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Run Build Script
        id: kernel-build
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_REPO: https://github.com/ahmed-alnassif/GKI-Duchamp-6.1
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          KSU: ${{ matrix.KSU }}
          KSU_COMPAT: ${{ matrix.KSU_COMPAT }}
          KSU_SUSFS: ${{ matrix.KSU_SUSFS }}
          C_LTO: ${{ matrix.C_LTO }}
          No_DS: ${{ matrix.No_DS }}
          TODO: kernel
          TEST: no
          LTO: ${{ startsWith(inputs.LTO, 'noneLTO') && 'noneLTO' || startsWith(inputs.LTO, 'thinLTO') && 'thinLTO' || 'fullLTO' }}
          CLEAN_LTO_CACHE: 'true'
          NETWORKING: ${{ inputs.NETWORKING }}
          BBG: ${{ inputs.BBG }}
          DROIDSPACES: 'false'
          NM: 'true'
          KERNEL_SUBLEVEL: ${{ inputs.KERNEL_SUBLEVEL }}
          BUILD_TIME: ${{ inputs.BUILD_TIME }}
          BUILD_NAME: ${{ matrix.name }}
          RUN_NUM: -r${{ github.run_number }}
          BUILD_REVISION: ${{ inputs.BUILD_REVISION }}
          CUSTOM_VERSION_NAME: Cogan
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          ./build.sh

      - name: Build result summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.kernel-build.outcome }}
          NETWORKING_INPUT: ${{ inputs.NETWORKING }}
          BBG_INPUT: ${{ inputs.BBG }}
          ROOT_MANAGER_INPUT: ${{ inputs.ROOT_MANAGER }}
        run: |
          {
            echo "## Cogan Kernel — Build Summary"
            echo ""
            echo "<details open><summary>🇮🇩 Bahasa Indonesia</summary>"
            echo ""
            echo "- Root manager: ${ROOT_MANAGER_INPUT}"
            echo "- Networking: ${NETWORKING_INPUT}"
            echo "- BBG: ${BBG_INPUT}"
            echo "- Hasil skrip build: ${BUILD_OUTCOME}"
            echo "- Rilis memerlukan persetujuan manual owner."
            echo ""
            if [ "${BUILD_OUTCOME}" != "success" ]; then
              echo "**Build gagal.** Periksa kesalahan pertama pada langkah **Run Build Script**."
              echo "Jangan flash artefak dari build yang gagal."
            else
              echo "**Skrip build berhasil.** ZIP dan kompatibilitas perangkat tetap harus diverifikasi."
            fi
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>🇬🇧 English</summary>"
            echo ""
            echo "- Root manager: ${ROOT_MANAGER_INPUT}"
            echo "- Networking: ${NETWORKING_INPUT}"
            echo "- BBG: ${BBG_INPUT}"
            echo "- Build script result: ${BUILD_OUTCOME}"
            echo "- Release requires manual owner approval."
            echo ""
            if [ "${BUILD_OUTCOME}" != "success" ]; then
              echo "**Build failed.** Inspect the first error in **Run Build Script**."
              echo "Do not flash artifacts from a failed build."
            else
              echo "**Build script succeeded.** ZIP integrity and device compatibility still require verification."
            fi
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats

      - name: Save ccache to release
        if: always() && inputs.BUILD_MODE == 'Standard Build'
        uses: ./.github/actions/ccache-save
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Save environment for release
        if: always()
        run: |
          cat > build-env-${{ matrix.name }}.txt << EOF
          RELEASE_REPO=${{ env.RELEASE_REPO }}
          KERNEL_NAME=${{ env.KERNEL_NAME }}
          RELEASE_NAME=${{ env.RELEASE_NAME }}
          RELEASE=${{ env.RELEASE }}
          LINUX_VERSION=${{ env.LINUX_VERSION }}
          COMPILER_STRING=${{ env.COMPILER_STRING }}
          SUSFS_VERSION=${{ env.SUSFS_VERSION }}
          BASE_NAME=${{ env.BASE_NAME }}
          KSU=${{ matrix.KSU }}
          KSU_SUSFS=${{ matrix.KSU_SUSFS }}
          KSUN_REF=${{ env.KSUN_REF }}
          KSUN_INSTALLED_SHA=${{ env.KSUN_INSTALLED_SHA }}
          ROOT_MANAGER_REPO=${{ env.ROOT_MANAGER_REPO }}
          ROOT_MANAGER_REF=${{ env.ROOT_MANAGER_REF }}
          ROOT_MANAGER_SHA=${{ env.ROOT_MANAGER_SHA }}
          SUSFS_SHA=${{ env.SUSFS_SHA }}
          KERNEL_VERSION=${{ env.KERNEL_VERSION }}
          ANDROID_RELEASE=${{ env.ANDROID_RELEASE }}
          KERNEL_SOURCE_REPO=${{ env.KERNEL_SOURCE_REPO }}
          KERNEL_SOURCE_BRANCH=${{ env.KERNEL_SOURCE_BRANCH }}
          EOF

          echo "BUILD_VARIANT=${{ matrix.name }}" >> build-env-${{ matrix.name }}.txt
          echo "Saved environment for ${{ matrix.name }}"

          if find . -name "*.rej" -type f | grep -q .; then
          mkdir -p rejected-patches-${{ matrix.name }}
          find . -name "*.rej" -type f -exec sh -c 'cp "$1" "rejected-patches-${{ matrix.name }}/$(echo "$1" | sed "s|^\./||; s|/|_|g")"' _ {} \;
          echo "Found $(find rejected-patches-${{ matrix.name }} -type f | wc -l) rejected patch files"
          else
            echo "No rejected patches found for ${{ matrix.name }}"
          fi

      - name: Upload environment file
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-env-${{ matrix.name }}-${{ github.run_number }}
          path: |
            build-env-${{ matrix.name }}.txt
            rejected-patches-${{ matrix.name }}/
          retention-days: 1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-${{ matrix.name }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 1

  upload-all:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: all-builds-${{ github.run_number }}
          retention-days: 7
          path: |
            downloaded-artifacts/artifacts/*.txt
            downloaded-artifacts/artifacts/*.zip

  release:
    needs: build
    # Manual release only: do not publish untested kernel builds automatically.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum *.zip > checksums.txt
          md5sum *.zip > checksums-md5.txt

      - name: Load environment from builds and prepare release body
        env:
          TEST_INPUT: no
          DROIDSPACES_INPUT: 'false'
          NM_INPUT: 'true'
          LTO_INPUT: ${{ startsWith(inputs.LTO, 'noneLTO') && 'noneLTO' || startsWith(inputs.LTO, 'thinLTO') && 'thinLTO' || 'fullLTO' }}
        run: python3 .github/scripts/prepare_release.py

      - name: Upload All Builds to release repo
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE }}
          prerelease: true
          files: |
            release-artifacts/*.zip
            release-artifacts/checksums.txt
            release-artifacts/checksums-md5.txt
          body_path: release_body.md

