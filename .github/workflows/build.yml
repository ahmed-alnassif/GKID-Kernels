name: Cogan Kernel Builder
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      ROOT_MANAGER:
        description: "Root manager (choose one, or all variants)"
        type: choice
        default: "KernelSU"
        options:
          - "KernelSU"
          - "KernelSU Next"
          - "KernelSU + SUSFS"
          - "BakaSU + SUSFS"
          - "Vanilla"
          - "All variants (advanced)"

      TODO:
        description: "Task"
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      TEST:
        description: "Debug pipeline"
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

      LTO:
        description: "LTO optimization"
        default: "fullLTO"
        type: choice
        options:
          - "noneLTO"
          - "thinLTO"
          - "fullLTO"

      KERNEL_VERSION:
        description: "GKI LTS kernel line to build"
        default: "6.1"
        type: choice
        options:
          - "All"
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"

      BUILD_REVISION:
        description: "Revision (optional, e.g. r9; blank = automatic run number)"
        type: string
        default: ""

      CUSTOM_VERSION_NAME:
        description: "Custom kernel name"
        type: choice
        default: "Cogan"
        options:
          - "Cogan"

      CLEAN_LTO_CACHE:
        description: "Clean ThinLTO cache (force reset)"
        type: boolean
        default: false

      DROIDSPACES:
        description: "Enable droidspaces-oss support"
        type: boolean
        default: true

      NM:
        description: "Enable NoMount support"
        type: boolean
        default: false

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  ensure-cache-release:
    name: Ensure ccache release exists
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Create persistent cache release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view ci-ccache-store --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ci-ccache-store already exists"
          else
            echo "Creating ci-ccache-store release"
            gh release create ci-ccache-store \
              --repo "${{ github.repository }}" \
              --title "CI ccache store (internal - do not delete)" \
              --notes "Persistent compiler cache used by the build workflow. Each build matrix entry keeps one asset here (ccache-<variant>.tar.zst). Safe to delete if you want to force a cold cache for everything; the workflow recreates this release and rebuilds the caches automatically, just slower for the next run per variant." \
              --prerelease \
              --latest=false
          fi

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Generate build matrix
        id: set-matrix
        env:
          KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}
          ROOT_MANAGER: ${{ inputs.ROOT_MANAGER }}
        run: |
          python3 py/generate-matrix.py >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, ensure-cache-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev ccache gh bc bison flex libssl-dev libelf-dev dwarves cpio
          pip install lxml

      - name: Restore ccache from release
        if: github.event.inputs.TEST == 'no' && github.event.inputs.TODO != 'defconfig'
        id: restore-ccache
        uses: ./.github/actions/ccache-restore
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Run Build Script
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_REPO: https://github.com/ahmed-alnassif/GKI-Duchamp-6.1
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          KSU: ${{ matrix.KSU }}
          KSU_COMPAT: ${{ matrix.KSU_COMPAT }}
          KSU_SUSFS: ${{ matrix.KSU_SUSFS }}
          C_LTO: ${{ matrix.C_LTO }}
          No_DS: ${{ matrix.No_DS }}
          TODO: ${{ inputs.TODO }}
          TEST: ${{ inputs.TEST }}
          LTO: ${{ inputs.LTO }}
          CLEAN_LTO_CACHE: ${{ inputs.CLEAN_LTO_CACHE }}
          DROIDSPACES: ${{ inputs.DROIDSPACES }}
          NM: ${{ inputs.NM }}
          BUILD_NAME: ${{ matrix.name }}
          RUN_NUM: -r${{ github.run_number }}
          BUILD_REVISION: ${{ inputs.BUILD_REVISION }}
          CUSTOM_VERSION_NAME: ${{ inputs.CUSTOM_VERSION_NAME }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          ./build.sh

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats

      - name: Save ccache to release
        if: always() && github.event.inputs.TEST == 'no' && github.event.inputs.TODO != 'defconfig'
        uses: ./.github/actions/ccache-save
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Save environment for release
        if: always()
        run: |
          cat > build-env-${{ matrix.name }}.txt << EOF
          RELEASE_REPO=${{ env.RELEASE_REPO }}
          KERNEL_NAME=${{ env.KERNEL_NAME }}
          RELEASE_NAME=${{ env.RELEASE_NAME }}
          RELEASE=${{ env.RELEASE }}
          LINUX_VERSION=${{ env.LINUX_VERSION }}
          COMPILER_STRING=${{ env.COMPILER_STRING }}
          SUSFS_VERSION=${{ env.SUSFS_VERSION }}
          BASE_NAME=${{ env.BASE_NAME }}
          KSU=${{ matrix.KSU }}
          KSU_SUSFS=${{ matrix.KSU_SUSFS }}
          KERNEL_VERSION=${{ env.KERNEL_VERSION }}
          ANDROID_RELEASE=${{ env.ANDROID_RELEASE }}
          KERNEL_SOURCE_REPO=${{ env.KERNEL_SOURCE_REPO }}
          KERNEL_SOURCE_BRANCH=${{ env.KERNEL_SOURCE_BRANCH }}
          EOF

          echo "BUILD_VARIANT=${{ matrix.name }}" >> build-env-${{ matrix.name }}.txt
          echo "Saved environment for ${{ matrix.name }}"

          if find . -name "*.rej" -type f | grep -q .; then
          mkdir -p rejected-patches-${{ matrix.name }}
          find . -name "*.rej" -type f -exec sh -c 'cp "$1" "rejected-patches-${{ matrix.name }}/$(echo "$1" | sed "s|^\./||; s|/|_|g")"' _ {} \;
          echo "Found $(find rejected-patches-${{ matrix.name }} -type f | wc -l) rejected patch files"
          else
            echo "No rejected patches found for ${{ matrix.name }}"
          fi

      - name: Upload environment file
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-env-${{ matrix.name }}-${{ github.run_number }}
          path: |
            build-env-${{ matrix.name }}.txt
            rejected-patches-${{ matrix.name }}/
          retention-days: 1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-${{ matrix.name }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 1

  upload-all:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: all-builds-${{ github.run_number }}
          retention-days: 7
          path: |
            downloaded-artifacts/artifacts/*.txt
            downloaded-artifacts/artifacts/*.zip

  release:
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.TODO != 'defconfig'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum *.zip > checksums.txt
          md5sum *.zip > checksums-md5.txt

      - name: Load environment from builds and prepare release body
        env:
          TEST_INPUT: ${{ inputs.TEST }}
          DROIDSPACES_INPUT: ${{ inputs.DroidSpaces }}
          NM_INPUT: ${{ inputs.NM }}
          LTO_INPUT: ${{ inputs.LTO }}
        run: python3 .github/scripts/prepare_release.py

      - name: Upload All Builds to release repo
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE }}
          prerelease: true
          files: |
            release-artifacts/*.zip
            release-artifacts/checksums.txt
            release-artifacts/checksums-md5.txt
          body_path: release_body.md

